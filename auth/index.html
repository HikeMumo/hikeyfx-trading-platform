<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b100e">
  <title>HikeyFX | Member access</title>
  <style>
    :root{color-scheme:dark;--bg:#0b100e;--panel:#111a15;--line:#26372c;--muted:#9aab9f;--text:#edf5ef;--green:#36c879;--gold:#c9a96e;font-family:Inter,system-ui,-apple-system,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#17271c 0,transparent 55%),var(--bg);color:var(--text);display:grid;place-items:center;padding:22px}
    .shell{width:min(100%,440px)}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;margin-bottom:24px}.mark{width:36px;height:36px;border:1px solid #47765b;border-radius:10px;display:grid;place-items:center;color:var(--green)}
    .card{background:rgba(17,26,21,.96);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 24px 70px #0005}.eyebrow{color:var(--green);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{font-size:25px;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 20px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:20px}.tabs button,.submit{border:1px solid var(--line);border-radius:9px;padding:11px;background:#0c130f;color:var(--muted);font-weight:700}.tabs button.active{background:#173022;color:#b5efc5;border-color:#31573e}
    label{display:block;font-size:11px;color:var(--muted);margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0c130f;color:var(--text);font:inherit;outline:none}input:focus{border-color:#4b9463}
    .submit{width:100%;margin-top:18px;background:var(--green);color:#07140b;border:0;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}
    .status{min-height:24px;margin-top:14px;color:var(--gold);font-size:12px;line-height:1.5}.fine{margin-top:18px;color:#829388;font-size:10px;line-height:1.6}.back{display:inline-block;margin-top:17px;color:#b5efc5;font-size:12px;text-decoration:none}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark">H</span>HikeyFX</div>
    <section class="card">
      <div class="eyebrow">Member access</div>
      <h1 id="heading">Welcome back</h1>
      <p class="sub" id="intro">Sign in to access your HikeyFX development account.</p>
      <div class="tabs" role="tablist" aria-label="Account access">
        <button id="loginTab" class="active" type="button">Sign in</button>
        <button id="signupTab" type="button">Create account</button>
      </div>
      <form id="authForm">
        <div id="nameField" hidden>
          <label for="displayName">Full name</label>
          <input id="displayName" name="displayName" autocomplete="name" maxlength="80">
        </div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128">
        <button class="submit" id="submitButton" type="submit">Sign in</button>
      </form>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <p class="fine">HikeyFX is currently a software-development project. This access page creates demo-only member accounts. Live trading and real-money deposits or withdrawals are not available.</p>
    </section>
    <a class="back" href="../index.html">← Back to HikeyFX</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
