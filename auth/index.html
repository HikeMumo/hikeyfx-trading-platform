<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f3e8">
  <title>HikeyFX | Member access</title>
  <style>
    :root{color-scheme:light;--bg:#f7f3e8;--panel:#fffdf7;--line:rgba(45,38,29,.18);--muted:#5c574f;--text:#171717;--green:#26734d;--gold:#6e675d;font-family:Inter,system-ui,-apple-system,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:22px}
    .shell{width:min(100%,440px)}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;margin-bottom:24px}.mark{width:36px;height:36px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:#171717}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:0 18px 48px rgba(30,24,16,.08)}.eyebrow{color:var(--green);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
    h1{font-size:25px;margin:8px 0}.sub{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 20px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:20px}.tabs button,.submit{border:1px solid var(--line);border-radius:9px;padding:11px;background:#f2eddf;color:var(--muted);font-weight:700}.tabs button.active{background:#e7efe7;color:#205d3e;border-color:#9bb69e}
    label{display:block;font-size:11px;color:var(--muted);margin:13px 0 6px}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text);font:inherit;outline:none}input:focus{border-color:#26734d}
    .submit{width:100%;margin-top:18px;background:#e7efe7;color:#171717;border:1px solid #9bb69e;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}
    .status{min-height:24px;margin-top:14px;color:var(--gold);font-size:12px;line-height:1.5}.fine{margin-top:18px;color:#829388;font-size:10px;line-height:1.6}.back{display:inline-block;margin-top:17px;color:#26734d;font-size:12px;text-decoration:none}
    .password-wrap{position:relative}.password-wrap input{padding-right:48px}.password-toggle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:#44413b;cursor:pointer}.password-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.password-toggle:focus-visible{outline:2px solid #26734d;outline-offset:1px}\n    [hidden]{display:none!important}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><span class="mark">H</span>HikeyFX</div>
    <section class="card">
      <div class="eyebrow">Member access</div>
      <h1 id="heading">Welcome back</h1>
      <p class="sub" id="intro">Sign in to access your HikeyFX development account.</p>
      <div class="tabs" role="tablist" aria-label="Account access">
        <button id="loginTab" class="active" type="button">Sign in</button>
        <button id="signupTab" type="button">Create account</button>
      </div>
      <form id="authForm">
        <div id="nameField" hidden>
          <label for="displayName">Full name</label>
          <input id="displayName" name="displayName" autocomplete="name" maxlength="80">
        </div>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
        <label for="password">Password</label>
        <div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"><button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
        <button class="submit" id="submitButton" type="submit">Sign in</button>
      </form>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <p class="fine">HikeyFX is currently a software-development project. This access page creates demo-only member accounts. Live trading and real-money deposits or withdrawals are not available.</p>
    </section>
    <a class="back" href="../index.html">← Back to HikeyFX</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./auth.js"></script>
</body>
</html>
